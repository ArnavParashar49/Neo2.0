[package]
name = "neo-ui"
version = "2.1.0"
description = "NEO overlay"
authors = ["Arnav Parashar"]
edition = "2021"

[lib]
name = "neo_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# NEO Sandbox: a test build beside the real NEO (its own home, port 18765, bundle id
# com.arnav.neo.sandbox). Only with tauri.sandbox.conf.json — build.rs refuses a release build
# otherwise. scripts/sandbox_build.sh builds it.
sandbox = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"  # the engine's SHA-256 (setup.rs); already in the lock through tauri

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = false  # this toolchain has no rust-objcopy (libLLVM); stripping only saves a few MB
