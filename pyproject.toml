[project]
name = "neo2"
version = "2.2.0"
description = "NEO — a free, local-first AI agent for your Mac"
requires-python = ">=3.12,<3.13"  # neo2/core/decide uses 3.12 syntax (PEP 695)
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arnav Parashar" }]
dependencies = [
  # The core: `import neo2`, an embedded agent (neo2.AsyncAgent / Agent) and NEO's agent loop, with
  # the weather and clock tools. Everything else is an extra below; NEO.app installs them all
  # (scripts/install-app.sh: requirements.lock, the `app` extra's exact versions).
  "numpy",
  "httpx",
  "pydantic>=2",
  "pydantic-settings>=2.7",  # NoDecode (config.py)
  "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/ArnavParashar49/Neo2.0"
Repository = "https://github.com/ArnavParashar49/Neo2.0"
GitHub = "https://github.com/ArnavParashar49"
LinkedIn = "https://www.linkedin.com/in/arnavparashar49/"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]
train = ["datasets"]  # python -m neo2.core.reflex.hf_data (Laya's Hugging Face training rows)
# brains: a vendor SDK is imported only when its provider is built
gemini = ["google-genai>=2.20"]
openai = ["openai>=2"]  # OpenAI, Groq, and any OpenAI-compatible or local server
claude = ["anthropic>=1"]
brains = ["neo2[gemini,openai,claude]"]
# tools
web = ["ddgs", "trafilatura", "pypdf"]  # web_search, web_fetch (pages and PDFs)
browser = ["playwright"]  # NEO's own browser tool; then: playwright install chromium
mac = [  # the macOS tools: see, click, type, apps, files, shell, mail, calendar, notes
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
    # calendars, reminders and contacts through the system stores (the same pyobjc release)
    "pyobjc-framework-EventKit>=12.2,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Contacts>=12.2,<13; sys_platform == 'darwin'",
    # capturing the screen in NEO's own process, and reading text off it (the same pyobjc release)
    "pyobjc-framework-ScreenCaptureKit>=12.2,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=12.2,<13; sys_platform == 'darwin'",
    "pillow",
    "tld",  # a site's registrable domain (neo2.core.decide.sites)
    "lxml",  # a site's own search form / OpenSearch description
    "python-dateutil",  # recurring events (RRULE) when a calendar is read by script
    "pypdf",  # read_file on a PDF
]
embeddings = ["sentence-transformers"]  # memory + tool-selection embeddings
reflex = ["laya>=0.3", "torch"]  # Laya, NEO.app's local decision model
voice = [  # local voice (Apple Silicon)
    "mlx-audio; sys_platform == 'darwin'",
    "misaki[en]; sys_platform == 'darwin'",
    "vosk",
    "sounddevice",
    "soundfile",
    "silero-vad",  # speech detection (5 s listening window)
    "torch",  # silero
]
local = ["mlx-lm; sys_platform == 'darwin'"]  # python -m neo2 --local: the offline brain
vision = [  # the camera: capture (AVFoundation), Apple Vision's labels / words / hands, the object boxes
    "pyobjc-framework-AVFoundation>=12.2,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=12.2,<13; sys_platform == 'darwin'",
    # YOLOE-26s's boxes: its Core ML model (scripts/get_yoloe.py makes it; building it needs
    # ultralytics and coremltools, in their own throwaway environment, never here)
    "pyobjc-framework-CoreML>=12.2,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",  # (its pixel buffers)
    "pillow",
    "transformers",  # D-FINE small, the fallback detector (transformers is already there for Laya)
    "torch",
    "torchvision",  # transformers' fast image processor for D-FINE
]
server = ["websockets>=13"]  # the overlay's websocket
# naming the song playing (song_identify): Shazam's fingerprint of what NEO hears (shazamio-core, Rust)
# and the one request to Shazam; the microphone is the voice extra's sounddevice, the Mac's own sound
# the mac extra's ScreenCaptureKit
music = ["shazamio==0.8.1"]
mcp = ["mcp>=2.2,<3"]  # python -m neo2.mcp (neo2-mcp)
langchain = ["langchain-core>=1,<2"]  # neo2.adapters.langchain
# NEO.app: exactly the dependencies it has always had
app = ["neo2[brains,web,embeddings,reflex,mac,browser,voice,local,server,vision,music]"]
all = ["neo2[app,mcp,langchain]"]

[project.scripts]
neo2 = "neo2.core.main:main"  # NEO in a terminal, as `python -m neo2` (--text, --doctor, --local)
neo2-mcp = "neo2.mcp:main"

[build-system]
requires = ["setuptools>=77"]  # SPDX license expression (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neo2*"]  # neo2, its core (neo2.core: NEO.app's own package, `neo` before 2.1) and the SDK
exclude = ["neo", "neo.*"]  # the repo-only compatibility shim: never in the wheel

[tool.setuptools.package-data]
neo2 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "portable: runs with the core install alone, on Linux as on macOS (CI's sdk-core job: pytest -m portable)",
  "bench: controls-bench regression thresholds (bench/controls; hermetic)",
]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv", "ui", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM105"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
exclude = "(^\\.venv/|^ui/|^models/)"
