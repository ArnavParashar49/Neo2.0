# Every push and pull request: lint, the Python tests, and the overlay (TypeScript, Vite build,
# Rust tests). macOS runners, because NEO drives macOS APIs (pyobjc, CoreGraphics). The sdk-core
# job checks NEO as a library other apps install (neo2): the wheel with no extras, on Linux too.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      NEO_REFLEX: "off"   # never load Laya (1.7 GB) in CI
      NEO_VOICE: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (exact versions from requirements.lock)
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.lock
          uv pip install --no-deps -e .
          uv pip install pytest pytest-asyncio ruff
      - name: Lint
        run: .venv/bin/ruff check neo neo2 tests scripts   # neo: the checkout's compatibility shim
      - name: Compile
        run: .venv/bin/python -m compileall -q neo neo2
      - name: Tests
        run: .venv/bin/python -m pytest -q -p no:cacheprovider

  sdk-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: uv build --out-dir dist
      - name: The wheel alone, no extras, in a clean venv
        # from outside the checkout, so neo2 can only come from the wheel
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 wheel-core
          uv pip install --python wheel-core/bin/python "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-core/bin/python -c "import neo2; from neo2 import AsyncAgent; print(neo2.__file__)"
          wheel-core/bin/python "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"
      - name: The wheel with the web extra
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 wheel-web
          whl=$(echo "$GITHUB_WORKSPACE"/dist/*.whl)
          uv pip install --python wheel-web/bin/python "${whl}[web]"
          wheel-web/bin/python "$GITHUB_WORKSPACE/scripts/wheel_smoke.py" --extra web
      - name: Install the checkout, core only
        run: |
          uv venv --python 3.12
          uv pip install -e . pytest pytest-asyncio
      - name: Portable SDK tests, core only
        run: .venv/bin/python -m pytest -q -p no:cacheprovider tests/sdk -m portable --ignore=tests/sdk/test_sdk_import_cost.py
      - name: Import budget (import neo2 is the standard library; AsyncAgent loads no model, vendor SDK, pyobjc or browser)
        run: .venv/bin/python -m pytest -q -p no:cacheprovider tests/sdk/test_sdk_import_cost.py
      - name: Portable SDK tests with the SDK's extras (vendor SDK shapes, MCP server, LangChain)
        run: |
          uv pip install -e ".[brains,mcp,langchain]"
          .venv/bin/python -m pytest -q -p no:cacheprovider tests/sdk -m portable

  overlay:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build the web part
        run: npm run build
      - name: Rust tests
        working-directory: ui/src-tauri
        run: cargo test --quiet
