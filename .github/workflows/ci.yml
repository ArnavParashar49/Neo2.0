# Every push and pull request: lint, the Python tests, and the overlay (TypeScript, Vite build,
# Rust tests). macOS runners, because NEO drives macOS APIs (pyobjc, CoreGraphics).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      NEO_REFLEX: "off"   # never load Laya (1.7 GB) in CI
      NEO_VOICE: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (exact versions from requirements.lock)
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.lock
          uv pip install --no-deps -e .
          uv pip install pytest pytest-asyncio ruff
      - name: Lint
        run: .venv/bin/ruff check neo tests
      - name: Compile
        run: .venv/bin/python -m compileall -q neo
      - name: Tests
        run: .venv/bin/python -m pytest -q -p no:cacheprovider

  overlay:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build the web part
        run: npm run build
      - name: Rust tests
        working-directory: ui/src-tauri
        run: cargo test --quiet
