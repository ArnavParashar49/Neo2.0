# Every push and pull request: lint, the Python tests, and the overlay (TypeScript, Vite build,
# its unit tests, Rust tests). macOS runners, because NEO drives macOS APIs (pyobjc, CoreGraphics).
# The sdk-core job checks NEO as a library other apps install (neo2): the wheel with no extras, on
# Linux too. release-files: one version everywhere and the release engine's inputs; app-bundle:
# NEO.app itself builds (tauri build, the app bundle only) for macOS 14.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      NEO_REFLEX: "off"   # never load Laya (1.7 GB) in CI
      NEO_VOICE: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (exact versions from requirements-dev.lock, the app's lock and the tests')
        run: |
          uv venv --python 3.12
          uv pip install -r requirements-dev.lock
          uv pip install --no-deps -e .
          uv pip install ruff
      - name: Lint
        run: .venv/bin/ruff check neo neo2 tests scripts   # neo: the checkout's compatibility shim  neo2-codemod: keep
      - name: Compile
        run: .venv/bin/python -m compileall -q neo neo2   # neo2-codemod: keep (the shim too)
      - name: Tests
        run: .venv/bin/python -m pytest -q -p no:cacheprovider

  sdk-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: uv build --out-dir dist
      - name: The wheel alone, no extras, in a clean venv
        # from outside the checkout, so neo2 can only come from the wheel
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 wheel-core
          uv pip install --python wheel-core/bin/python "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-core/bin/python -c "import neo2; from neo2 import AsyncAgent; print(neo2.__file__)"
          wheel-core/bin/python "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"
      - name: The wheel with the web extra
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 wheel-web
          whl=$(echo "$GITHUB_WORKSPACE"/dist/*.whl)
          uv pip install --python wheel-web/bin/python "${whl}[web]"
          wheel-web/bin/python "$GITHUB_WORKSPACE/scripts/wheel_smoke.py" --extra web
      - name: Install the checkout, core only
        run: |
          uv venv --python 3.12
          uv pip install -e . pytest pytest-asyncio
      - name: Portable SDK tests, core only
        run: .venv/bin/python -m pytest -q -p no:cacheprovider tests/sdk -m portable --ignore=tests/sdk/test_sdk_import_cost.py
      - name: Import budget (import neo2 is the standard library; AsyncAgent loads no model, vendor SDK, pyobjc or browser)
        run: .venv/bin/python -m pytest -q -p no:cacheprovider tests/sdk/test_sdk_import_cost.py
      - name: Portable SDK tests with the SDK's extras (vendor SDK shapes, MCP server, LangChain)
        run: |
          uv pip install -e ".[brains,mcp,langchain]"
          .venv/bin/python -m pytest -q -p no:cacheprovider tests/sdk -m portable

  overlay:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # Vite 8: 22.12+; npm test runs .ts files directly (type stripping: 22.18+)
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (node --test)
        run: npm test
      - name: Build the web part
        run: npm run build
      - name: Rust tests
        working-directory: ui/src-tauri
        run: cargo test --quiet

  release-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: One version in every file (pyproject, neo2, tauri.conf.json, Cargo, package.json)
        run: python3 scripts/version.py check
      - name: The release engine's inputs (scripts/engine.env, requirements.release.txt, the prune list)
        run: python3 scripts/engine_id.py --explain
      - name: The release scripts parse
        run: bash -n scripts/build_engine.sh scripts/lock-deps.sh

  app-bundle:
    # NEO.app as a release builds it (scripts/build_release.sh): tauri build, the app bundle only, for
    # macOS 14 (LSMinimumSystemVersion). Ad-hoc signed here; no DMG, no engine, nothing published.
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
          key: app-bundle  # the release profile's own cache (LTO), apart from the tests' debug one
      - run: npm ci
      - name: tauri build --bundles app
        run: npm run tauri build -- --bundles app
      - name: The bundle (signature, macOS floor, version)
        run: |
          app=src-tauri/target/release/bundle/macos/NEO.app
          codesign --verify --strict "$app"
          floor=$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")
          version=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
          echo "NEO.app $version, macOS $floor+"
          test "$floor" = "14.0"
          python3 ../scripts/version.py check "$version"
